<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="gradGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#gradBg)" filter="url(#dropShadow)"/>
  
  <!-- Inner Glass highlight -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#gradGlass)"/>
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Code brackets < > -->
  <path d="M 45 44 L 25 64 L 45 84" fill="none" stroke="white" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 83 44 L 103 64 L 83 84" fill="none" stroke="white" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Colorful paintbrush/CSS magic wand in the center -->
  <path d="M 64 30 C 80 30 80 46 64 64 C 48 82 48 98 64 98 C 72 98 78 92 78 84 C 78 72 64 64 64 64 C 64 64 50 56 50 44 C 50 36 56 30 64 30 Z" fill="url(#gradAccent)"/>
  
  <!-- Wand highlights -->
  <circle cx="64" cy="40" r="4" fill="white" fill-opacity="0.8"/>
  <circle cx="72" cy="78" r="3" fill="white" fill-opacity="0.6"/>
</svg>
